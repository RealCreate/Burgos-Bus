# Twice a week, download the city's timetable (GTFS) and rebuild the site if it changed.
# Nothing is committed when the timetable is the same, and a timetable that looks broken
# (empty, or ending earlier than the current one) is never published: the run fails instead,
# and GitHub emails you. You can also run it by hand: Actions -> Update timetable -> Run workflow.
name: Update timetable

on:
  schedule:
    - cron: '17 5 * * 1,4'   # Mondays and Thursdays, about 07:17 in Burgos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-timetable
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the timetable
        run: |
          # The city's server doesn't answer GitHub's machines, so fall back to MobilityData's public
          # mirror of the same feed. A stale mirror is harmless: an older timetable is never published.
          get() { curl -4 -fSL --connect-timeout 20 --max-time 180 --retry 1 --retry-delay 10 --retry-all-errors \
                    -A "Mozilla/5.0 (Burgos Bus site updater)" -o Google_transit.zip "$1" && unzip -tq Google_transit.zip; }
          if get https://www.aytoburgos.es/GTFS/Google_transit.zip; then
            echo "::notice::Timetable downloaded from aytoburgos.es"
          elif get "https://storage.googleapis.com/storage/v1/b/mdb-latest/o/es-castile-and-leon-autobuses-urbanos-de-burgos-gtfs-3145.zip?alt=media"; then
            echo "::notice::aytoburgos.es unreachable; timetable downloaded from the MobilityData mirror"
          else
            echo "::error::Could not download the timetable from aytoburgos.es or the MobilityData mirror"; exit 1
          fi
          range=$(python3 -c "import csv,io,zipfile;z=zipfile.ZipFile('Google_transit.zip');d=sorted({r['date'] for r in csv.DictReader(io.TextIOWrapper(z.open('calendar_dates.txt'),'utf-8-sig'))});print(d[0],'-',d[-1]) if d else print('no calendar_dates')")
          echo "::notice::Downloaded timetable covers $range"

      - name: Rebuild
        run: |
          cp index.html /tmp/old_index.html
          python3 tools/build_site.py Google_transit.zip > /tmp/build.log
          tail -n 1 /tmp/build.log

      - name: Publish if the timetable changed
        run: |
          result=$(python3 tools/timetable_changed.py /tmp/old_index.html index.html) || { echo "::error::$result"; exit 1; }
          echo "::notice::$result"
          if [ "$result" = "same" ]; then
            git checkout -- index.html
            echo "Timetable unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Timetable update: ${result#changed: }"
          git push
