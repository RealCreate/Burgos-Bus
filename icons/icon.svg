<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FB0FF"/>
      <stop offset="1" stop-color="#0058E6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EEFB"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C8DF5"/>
      <stop offset="1" stop-color="#0A5FD0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#002E7A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="180" height="180" fill="url(#bg)"/>
  <rect width="180" height="180" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <!-- wheels -->
    <rect x="58" y="118" width="18" height="24" rx="6" fill="#D5E3F6"/>
    <rect x="104" y="118" width="18" height="24" rx="6" fill="#D5E3F6"/>
    <!-- mirrors -->
    <rect x="41" y="56" width="9" height="20" rx="4.5" fill="url(#body)"/>
    <rect x="130" y="56" width="9" height="20" rx="4.5" fill="url(#body)"/>
    <!-- body -->
    <rect x="50" y="34" width="80" height="94" rx="18" fill="url(#body)"/>
  </g>

  <!-- destination sign -->
  <rect x="70" y="42" width="40" height="7" rx="3.5" fill="#0A5FD0" opacity="0.85"/>
  <!-- windshield -->
  <rect x="58" y="55" width="64" height="40" rx="9" fill="url(#glass)"/>
  <path d="M58 64a9 9 0 0 1 9-9h40L74 95h-7a9 9 0 0 1-9-9z" fill="url(#shine)"/>
  <!-- headlights -->
  <circle cx="70" cy="110" r="6.5" fill="#0A5FD0" opacity="0.18"/>
  <circle cx="70" cy="110" r="4.5" fill="#FFD60A"/>
  <circle cx="110" cy="110" r="6.5" fill="#0A5FD0" opacity="0.18"/>
  <circle cx="110" cy="110" r="4.5" fill="#FFD60A"/>
  <!-- grille -->
  <rect x="82" y="107" width="16" height="6" rx="3" fill="#0A5FD0" opacity="0.18"/>
</svg>
