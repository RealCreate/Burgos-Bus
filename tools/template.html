<style>
/* Layout: the map is the app. Header, buttons, panels and pop-ups float over it as translucent
   material (Apple's approach); lists inside are iOS inset-grouped. Colours are iOS system colours. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --sunk:rgba(118,118,128,.12); --ink:#000000; --muted:rgba(60,60,67,.62); --rule:rgba(60,60,67,.22);
  --accent:#007AFF; --accent-ink:#FFFFFF; --live:#28A745; --warn:#C93400; --star:#FF9F0A; --sel:#FF9500;
  --glass:rgba(249,249,251,.74); --glass-solid:#F9F9FB; --glass-edge:rgba(255,255,255,.55); --press:rgba(60,60,67,.10);
  --seg-on:#FFFFFF; --seg-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  --font-display:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.06);
  --float:0 8px 32px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.08);
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --hdr:60px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --sunk:rgba(118,118,128,.24); --ink:#FFFFFF; --muted:rgba(235,235,245,.62); --rule:rgba(84,84,88,.6);
  --accent:#0A84FF; --accent-ink:#FFFFFF; --live:#30D158; --warn:#FF9F0A; --star:#FFD60A; --sel:#FF9F0A;
  --glass:rgba(30,30,32,.72); --glass-solid:#1E1E20; --glass-edge:rgba(255,255,255,.08); --press:rgba(235,235,245,.12);
  --seg-on:#636366; --seg-shadow:0 3px 8px rgba(0,0,0,.3);
  --shadow:none; --float:0 8px 32px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --sunk:rgba(118,118,128,.24); --ink:#FFFFFF; --muted:rgba(235,235,245,.62); --rule:rgba(84,84,88,.6);
  --accent:#0A84FF; --accent-ink:#FFFFFF; --live:#30D158; --warn:#FF9F0A; --star:#FFD60A; --sel:#FF9F0A;
  --glass:rgba(30,30,32,.72); --glass-solid:#1E1E20; --glass-edge:rgba(255,255,255,.08); --press:rgba(235,235,245,.12);
  --seg-on:#636366; --seg-shadow:0 3px 8px rgba(0,0,0,.3);
  --shadow:none; --float:0 8px 32px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}

/* header */
.top{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--rule)}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;line-height:1;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand svg{flex:none}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:0;margin-top:3px}
.day{appearance:none;-webkit-appearance:none;background:var(--sunk);border:1px solid var(--rule);border-radius:999px;padding:6px 28px 6px 12px;font:600 .85rem var(--font-body);color:var(--ink);
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}

.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:14px 16px 28px}

/* tab bar */
/* side panel: left card on tablets, bottom sheet on phones */
.panel{position:absolute;z-index:1100;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 8px 30px rgba(10,20,30,.28);overflow:hidden;transition:transform .25s ease,height .25s ease}
.panel[hidden]{display:none!important}
@media (min-width:700px){.panel{top:12px;left:12px;bottom:12px;width:min(390px,calc(100% - 24px));border-radius:16px}}
@media (max-width:699px){.panel{left:0;right:0;bottom:0;height:56%;border-radius:18px 18px 0 0}.panel.full{height:100%;border-radius:0}}
.pbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--rule)}
.pbar .seg{flex:1;margin:0;padding:3px}
.pbar .seg button{padding:7px 8px}
.ibtn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;flex:none;color:var(--muted)}
.ibtn:active{background:var(--sunk)}
.grab{display:none}
@media (max-width:699px){.grab{display:flex}}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
.fab{position:absolute;z-index:1000;top:12px;left:12px;display:flex;gap:8px}
.fab button,.selchip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 2px 10px rgba(10,20,30,.25)}
.fab button svg{width:20px;height:20px;color:var(--accent)}
.selchip{position:absolute;z-index:1000;left:12px;bottom:28px;max-width:calc(100% - 24px);padding:6px 6px 6px 8px}
.selchip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.selchip .x{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.leaflet-top.leaflet-right{top:6px}

/* generic */
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:inherit}
.eyebrow{font:700 .72rem var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.note{font-size:.8rem;color:var(--muted);margin:22px 2px 0;line-height:1.5}
.banner{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--rule));color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.84rem;margin-bottom:12px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}

.badge{display:inline-flex;align-items:center;justify-content:center;min-width:2.3em;height:1.75em;padding:0 .35em;border-radius:6px;font:700 1rem/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.01em;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.badge.sm{font-size:.78rem;min-width:2.1em;height:1.6em;border-radius:5px}
.badge.lg{font-size:1.5rem;height:1.6em;border-radius:8px}
.badge.off{background:var(--sunk)!important;color:var(--muted)!important;box-shadow:inset 0 0 0 1.5px var(--rule)}
.tog{flex:none;border-radius:8px;padding:4px;margin:-4px}
.tog .badge{transition:background-color .2s,color .2s,transform .15s}
.tog:active .badge{transform:scale(.92)}
.bulk{display:flex;gap:8px;margin:12px 0 0}
.bulk .chip{color:var(--accent)}

.list{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row:active{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .t1{font-weight:700;line-height:1.25}
.row .t2{font-size:.82rem;color:var(--muted);margin-top:2px}
.row .chev{color:var(--muted);flex:none}
.live{color:var(--live);font-weight:700}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:5px;vertical-align:1px;animation:pulse 2s infinite}

@media (prefers-reduced-motion:reduce){.livedot{animation:none}}
.star{color:var(--rule);font-size:1.25rem;line-height:1;padding:6px}
.star.on{color:var(--star)}

/* detail header */
.dhead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
.back{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;flex:none}
.back:active{background:var(--sunk)}
.dhead .main{flex:1;min-width:0}
.dhead h2{margin:0;font:700 1.2rem/1.15 var(--font-display);text-wrap:balance}
.dhead .sub{font-size:.8rem;color:var(--muted)}

.seg{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:12px;margin-bottom:10px}
.seg button{flex:1;min-width:0;padding:9px 8px;border-radius:9px;font-weight:700;font-size:.88rem;line-height:1.2;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button span{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 11px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);font-size:.8rem;font-weight:700;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{font-size:.86rem;margin:4px 2px 12px;color:var(--muted)}

/* route timeline */
.tl{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:6px 0}
.stop{position:relative;padding:10px 14px 12px 54px;min-height:58px}
.stop::before{content:"";position:absolute;left:26px;top:0;bottom:0;width:6px;background:var(--rc)}
.stop.first::before{top:20px}
.stop.last::before{bottom:calc(100% - 20px)}
.dot{position:absolute;left:21px;top:13px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:4px solid var(--rc);z-index:1}
.stop.first .dot,.stop.last .dot{width:20px;height:20px;left:19px;top:11px;border-width:5px}
.stop.hl{background:color-mix(in srgb,var(--rc) 12%,transparent)}
.stop .nm{width:100%;text-align:left;display:block}
.stop .nm b{font-weight:700;line-height:1.25}
.stop .code{font-size:.72rem;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.xfer{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tm{font:600 .95rem/1 var(--font-display);font-variant-numeric:tabular-nums;padding:5px 8px;border-radius:7px;background:var(--sunk);color:var(--ink)}
.tm.next{background:var(--ink);color:var(--bg)}
.tm em{font-style:normal;font-family:var(--font-body);font-weight:400;font-size:.7rem;color:inherit;opacity:.75;margin-left:4px}
.tm.none{background:none;padding-left:0;color:var(--muted);font-family:var(--font-body);font-weight:400;font-size:.82rem}
.bus{position:absolute;left:12px;z-index:3;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:34px;height:24px;border-radius:7px;background:var(--rc);color:var(--rt);box-shadow:0 0 0 2px var(--surface),0 2px 6px rgba(0,0,0,.25);transition:top .8s ease}
.bus svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){.bus{transition:none}}
.full{margin-top:10px;border-top:1px dashed var(--rule);padding-top:8px}
.full .hr{display:grid;grid-template-columns:2.4em 1fr;gap:6px;padding:3px 0;font-variant-numeric:tabular-nums}
.full .hr b{font:700 .95rem var(--font-display);color:var(--muted)}
.full .hr span{font:500 .95rem var(--font-display);word-spacing:.35em}
.full .hr span i{font-style:normal;color:var(--muted);font-size:.75em}
.full .past{opacity:.45}
.linkbtn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;margin-right:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--rule);font-size:.8rem;font-weight:700;color:var(--accent);text-decoration:none;background:var(--surface)}

/* departures board */
.dep{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--rule);width:100%;text-align:left}
.dep:first-child{border-top:0}
.dep .main{flex:1;min-width:0}
.dep .hs{font-weight:700;line-height:1.2}
.dep .via{font-size:.78rem;color:var(--muted)}
.dep .when{text-align:right;font:700 1.15rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.dep .when small{display:block;font:400 .74rem var(--font-body);color:var(--muted);margin-top:3px}
.dep .when.soon{color:var(--live)}

/* map */
#map{position:absolute;inset:0;background:var(--bg)}
.leaflet-container{background:var(--bg)!important;font-family:var(--font-body)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface)!important;color:var(--ink)!important}
.leaflet-bar a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--rule)!important}
/* bus marker: a bus seen from above, turned to face its direction of travel.
   The body and the grey arrow in front of it rotate; the line number on the roof stays upright. */
.vehwrap{pointer-events:none!important}
/* language picker */
.langbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--sunk);font:700 .8rem var(--font-body);color:var(--ink)}
.flag{display:inline-block;flex:none;width:1.45em;height:1.05em;line-height:1.05em;font-size:1.05rem;text-align:center;border-radius:2px;overflow:hidden}
.flag-ca{background:repeating-linear-gradient(to bottom,#FCDD09 0 11.11%,#DA121A 11.11% 22.22%)}
.flag-gl{background:linear-gradient(to top right,#fff 41%,#009FE3 41% 59%,#fff 59%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.flag-eu{background:linear-gradient(#fff,#fff) center/14% 100% no-repeat,linear-gradient(#fff,#fff) center/100% 18% no-repeat,linear-gradient(to top right,transparent 44%,#009B48 44% 56%,transparent 56%),linear-gradient(to bottom right,transparent 44%,#009B48 44% 56%,transparent 56%),#D52B1E}
.langback{position:absolute;inset:0;z-index:1900;background:rgba(5,12,20,.45)}
.langsheet{position:absolute;z-index:2000;display:flex;flex-direction:column;gap:10px;background:var(--bg);box-shadow:0 10px 40px rgba(0,0,0,.35);padding:12px 14px 14px}
.langsheet[hidden],.langback[hidden]{display:none!important}
@media (min-width:700px){.langsheet{top:12px;right:12px;width:340px;max-height:calc(100% - 24px);border-radius:16px}}
@media (max-width:699px){.langsheet{left:0;right:0;bottom:0;max-height:80%;border-radius:18px 18px 0 0}}
.lshead{display:flex;align-items:center;justify-content:space-between}
.lshead h3{margin:0 4px;font:700 1.15rem var(--font-display)}
.lslist{overflow-y:auto;min-height:0;margin:0 -14px;padding:0 14px}
.lslist .eyebrow{margin-top:6px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;text-align:left;border-top:1px solid var(--rule)}
.lrow:first-child{border-top:0}
.lrow .main{flex:1;min-width:0}
.lrow .t1{font-weight:700}
.lrow .t2{font-size:.78rem;color:var(--muted)}
.lrow .ck{color:var(--accent);font-weight:700}
.lrow[aria-current="true"]{background:color-mix(in srgb,var(--accent) 10%,transparent)}
/* selected stop: filled in the selection colour, white rim, soft pulsing ring */
.selstop{pointer-events:none!important}
.selstop .dot{position:absolute;inset:8px;border-radius:50%;background:var(--sel);box-shadow:0 0 0 3px #fff,0 2px 8px rgba(0,0,0,.45)}
.selstop .ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--sel);opacity:0;animation:selpulse 1.8s ease-out infinite}
@keyframes selpulse{0%{transform:scale(.45);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.selstop .ring{animation:none;opacity:.5;transform:scale(.9)}}
.veh{position:relative;width:60px;height:60px;pointer-events:none}
.veh .rot{position:absolute;inset:0;transition:transform .9s linear}
.veh .hit{position:absolute;inset:6px;border-radius:50%;pointer-events:auto;cursor:pointer}
.busdet h4{display:flex;align-items:center;gap:6px}
.bstat{display:flex;align-items:center;gap:7px;margin:8px 0 2px;font-size:.88rem}
.bstat .sdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.bstat.move .sdot{background:var(--live);animation:pulse 2s infinite}
.bstat.stop .sdot{background:var(--star)}
.bstat.wait .sdot{background:var(--muted)}
.bline{font-size:.86rem;margin-bottom:4px}
.busdet .bar{height:4px;border-radius:2px;background:var(--sunk);margin:5px 0 2px;overflow:hidden}
.busdet .bar span{display:block;height:100%;background:var(--accent)}
.busdet ul{margin:4px 0 8px}
.busdet li .ph{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* waiting at the start of its next trip: same bus, slightly faded */
.parked .veh .body{opacity:.72}
.parked .veh .arrow{opacity:.55}
.bus.parked{opacity:.65}
.veh .body{position:absolute;left:50%;top:50%;width:22.4px;height:48.2px;margin:-24.1px 0 0 -11.2px;overflow:visible;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.veh .arrow{position:absolute;left:50%;top:-6px;margin-left:-6px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:8px solid var(--muted);filter:drop-shadow(0 0 1.5px var(--surface))}
.veh .num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 11.5px/1 var(--font-display);letter-spacing:-.02em;color:var(--t);font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none}
@media (prefers-reduced-motion:reduce){.veh .rot{transition:none}}
.pop h4{margin:0 0 2px;font:700 1rem var(--font-display)}
.pop .code{font-size:.72rem;color:var(--muted)}
.pop ul{list-style:none;margin:8px 0 6px;padding:0;display:flex;flex-direction:column;gap:4px}
.pop li{display:flex;align-items:center;gap:6px;font-size:.82rem}
.pop li b{margin-left:auto;font:700 .95rem var(--font-display);font-variant-numeric:tabular-nums}
.pop button{font-weight:700;color:var(--accent);font-size:.84rem}
.pop li{flex-wrap:wrap;row-gap:2px}
.pop .pl{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:700;min-width:0;flex:1;text-align:left}
.pop .ph{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .pt{margin-left:auto;font:700 .9rem var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
/* Leaflet's own .leaflet-bar a rules (display:block, line-height) outrank a plain class, so match their specificity */
.leaflet-bar a.locate{display:flex;align-items:center;justify-content:center;padding:0;line-height:0;background:var(--surface)!important;color:var(--accent)!important}
.leaflet-bar a.locate svg{display:block;flex:none}
.leaflet-bar a.locate.busy svg{animation:pulse 1s infinite}
.leaflet-bar a.locate.following{background:var(--accent)!important;color:#fff!important}
.leaflet-bar a.locate svg{transition:transform 300ms var(--ease-out)}
.leaflet-bar a.locate.following svg{transform:scale(1.08)}
.me{display:block;width:18px;height:18px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 85%,transparent)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--accent)!important}
__LEAFLET_CSS__

/* ================= Apple layer ================= */
body{font:16px/1.4 var(--font-body);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.app{position:relative}
.stage{position:absolute;inset:0}
/* translucent material: blur what's underneath instead of covering it */
.top,.fab button,.selchip,.panel,.langsheet,.leaflet-popup-content-wrapper,.leaflet-bar{
  background:var(--glass)!important;-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
@media (prefers-reduced-transparency:reduce){
  .top,.fab button,.selchip,.panel,.langsheet,.leaflet-popup-content-wrapper,.leaflet-bar{background:var(--glass-solid)!important;-webkit-backdrop-filter:none;backdrop-filter:none}}
.top{position:absolute;z-index:1500;left:0;right:0;top:0;padding:8px 14px;border-bottom:.5px solid var(--rule);box-shadow:none}

const stopRefs = S.map(()=>[]); P.forEach(p=>p.s.forEach((s,k)=>stopRefs[s].push({p,k})));
const stopRoutes = S.map((_,i)=>[...new Set(stopRefs[i].map(x=>x.p.r))].sort((a,b)=>a-b));
const dataKeys = Object.keys(D.dates).sort();

/* ---------- time ---------- */
const fmtParts = new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function madridNow(){const o={};fmtParts.formatToParts(new Date()).forEach(p=>o[p.type]=p.value);return {key:o.year+o.month+o.day, sec:(+o.hour)*3600+(+o.minute)*60+(+o.second)}}
const keyToUTC = k => Date.UTC(+k.slice(0,4), +k.slice(4,6)-1, +k.slice(6,8));
function addDays(k,n){const d=new Date(keyToUTC(k)+n*864e5);return d.getUTCFullYear()+String(d.getUTCMonth()+1).padStart(2,'0')+String(d.getUTCDate()).padStart(2,'0')}
const dfmt=(k,o)=>{try{return new Intl.DateTimeFormat(I18N[lang].loc,Object.assign({timeZone:'UTC'},o)).format(new Date(keyToUTC(k)))}catch(e){return new Intl.DateTimeFormat('en-GB',Object.assign({timeZone:'UTC'},o)).format(new Date(keyToUTC(k)))}};
const wday = k => new Date(keyToUTC(k)).getUTCDay();
const prettyKey = k => dfmt(k,{weekday:'short',day:'numeric',month:'short'});
const longKey = k => dfmt(k,{day:'numeric',month:'short',year:'numeric'});
const wdayLong = k => dfmt(k,{weekday:'long'});
const resolved = {};
function resolveKey(k){
  if(resolved[k]) return resolved[k];
  if(D.dates[k]) return resolved[k]={key:k,fb:false};
  const w=wday(k); let best=null, bd=1e15;
  for(const dk of dataKeys){ if(wday(dk)!==w) continue; const d=Math.abs(keyToUTC(dk)-keyToUTC(k)); if(d<bd){bd=d;best=dk} }
  return resolved[k]={key:best||dataKeys[dataKeys.length-1],fb:true};
}
const svcCache = {};
function svcSet(k){const rk=resolveKey(k).key;return svcCache[rk]||(svcCache[rk]=new Set(D.dates[rk]||[]))}
const tripCache = new Map();
function tripsOn(p,k){const id=p.id+'|'+resolveKey(k).key;let v=tripCache.get(id);if(!v){const set=svcSet(k);v=p.trips.filter(t=>set.has(t.svc));tripCache.set(id,v)}return v}
const hhmm = s => {s=((s%86400)+86400)%86400;return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')};
function rel(diff){if(diff<60)return T('due');const m=Math.floor(diff/60);if(m<60)return T('min',{n:m});return null}

/* ---------- state ---------- */

try{const v=JSON.parse(localStorage.getItem('burgosbus-fav')||'null');if(v&&Array.isArray(v.lines)&&Array.isArray(v.stops))fav=v}catch(e){}

try{if(localStorage.getItem('burgosbus-hinted'))firstVisit=false}catch(e){}
/* Lines drawn on the map: the ones switched on, plus (only while a stop's timetable is open)
   every line serving that stop. Those extra lines are never written to `active`, so leaving the
   stop view drops them again while lines switched on beforehand stay on. */
function shownLines(){
  const s=new Set(active); const top=st.stack[st.stack.length-1];
  if(st.panel&&top&&top.kind==='stop') stopRoutes[top.s].forEach(r=>s.add(r));
  return s;
}
function saveActive(){try{localStorage.setItem('burgosbus-active',JSON.stringify([...active]))}catch(e){}}
function toggleActive(r){if(active.has(r))active.delete(r);else active.add(r);saveActive();render(true)}
/* Starring adds or removes a Favourites block above the list. Keep the row you tapped
   exactly where it was on screen so the list never jumps under your finger. */
function sectionOf(el){const l=el.closest('.list');const e=l&&l.previousElementSibling;return e&&e.classList.contains('eyebrow')?e.textContent.replace(/[\d·]/g,'').trim():''}
function toggleFav(kind,id,btn){
  const a=fav[kind];const i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);saveFav();
  const sel=`[data-fav-${kind==='lines'?'line':'stop'}="${id}"]`;
  const sec=btn?sectionOf(btn):null, y0=btn?btn.getBoundingClientRect().top:0;
  const allHead=()=>view.querySelector('[data-sec="all"]');
  const h0=allHead(), hy0=h0?h0.getBoundingClientRect().top:0;
  render(true);
  if(!btn) return;
  const same=[...view.querySelectorAll(sel)].find(b=>sectionOf(b)===sec);
  if(same) view.scrollTop+=same.getBoundingClientRect().top-y0;
  else { const h1=allHead(); if(h1&&h0) view.scrollTop+=h1.getBoundingClientRect().top-hy0; }
}

function ctx(){
  const now=madridNow();
  const key=addDays(now.key,st.day);
  return {nowKey:now.key, nowSec:now.sec, key, live:st.day===0, from: st.day===0?now.sec:0};
}

/* trips running on the selected service day, plus yesterday's after-midnight trips when looking at today */
function dayTrips(p,c){
  const out=tripsOn(p,c.key).map(t=>({t,off:0}));
  if(c.live){const y=addDays(c.key,-1);for(const t of tripsOn(p,y)){if(t.start+t.prof[t.prof.length-1]>=86400-60)out.push({t,off:-86400})}}
  return out;
}
function activeTrips(pats,c){
  const out=[]; if(!c.live) return out;
  const N=c.nowSec;
  for(const p of pats){for(const {t,off} of dayTrips(p,c)){
    const t0=t.start+off, end=t0+t.prof[t.prof.length-1];
    if(N<t0||N>end) continue;
    const el=N-t0; let k=0; while(k<t.prof.length-2&&t.prof[k+1]<=el)k++;
    const span=t.prof[k+1]-t.prof[k]; const f=span>0?Math.min(1,Math.max(0,(el-t.prof[k])/span)):0;
    out.push({p,t,off,k,f});
  }}
  return out;
}
/* Buses parked at the start of their next trip. Between trips a bus waits at the end of the line
   (C2 sits at F. Politecnica for ~5 min), so it is shown there for up to WAIT_MAX before it leaves,
   unless the bus that will run that trip is still driving in (an active trip of the same line
   ending near that stop), and only the earliest departure per line and stop area. */
const WAIT_MAX=12*60;
const tripKey=(p,t,off)=>p.id+':'+t.start+':'+off;
/* Pair every trip that starts within WAIT_MAX with the bus that will run it: a bus of the same line
   whose current trip ends near that first stop in time (earliest arrival takes the earliest
   departure). Departures left without such a bus get a bus parked at their first stop. */
function upcomingPlan(pats,c){
  const plan={parked:[],incoming:new Map()};
  if(!c.live) return plan;
  const N=c.nowSec, routes=new Set(pats.map(p=>p.r));
  const act=activeTrips(P.filter(p=>routes.has(p.r)),c);
  const near=(a,b)=>a===b||distM(S[a].lat,S[a].lon,S[b].lat,S[b].lon)<250;
  const deps=[];
  for(const p of P){ if(!routes.has(p.r)) continue;
    for(const {t,off} of dayTrips(p,c)){const t0=t.start+off; if(t0>N&&t0-N<=WAIT_MAX) deps.push({p,t,off,k:0,f:0,wait:true,t0});}}
  deps.sort((a,b)=>a.t0-b.t0);
  const arr=act.map(a=>({a,end:a.t.start+a.off+a.t.prof[a.t.prof.length-1],last:a.p.s[a.p.s.length-1],used:false})).sort((x,y)=>x.end-y.end);
  const shown=new Set(pats.map(p=>p.id));
  for(const d of deps){
    const bus=arr.find(x=>!x.used&&x.a.p.r===d.p.r&&near(x.last,d.p.s[0])&&x.end<=d.t0+60);
    if(bus){ bus.used=true; plan.incoming.set(tripKey(d.p,d.t,d.off),bus.a); }
    else if(shown.has(d.p.id)) plan.parked.push(d);
  }
  return plan;
}
function waitingTrips(pats,c){ return upcomingPlan(pats,c).parked; }
/* departures at stop s for patterns passing filter */
function departuresAt(s,c,filter,opts={}){
  const out=[];
  for(const {p,k} of stopRefs[s]){
    if(filter&&!filter(p)) continue;
    if(!opts.terminus&&k===p.s.length-1) continue;
    for(const {t,off} of dayTrips(p,c)){const tm=t.start+t.prof[k]+off;if(tm>=(opts.from??-1e9))out.push({tm,p,k,t,off})}
  }
  out.sort((a,b)=>a.tm-b.tm);
  return out;
}
const UNI=(()=>{const s=S.find(x=>x.code==='PA00305');return s?[s.lat,s.lon]:[42.3428,-3.7350]})();
const distM=(a,b,c,d)=>Math.hypot((a-c)*111320,(b-d)*111320*Math.cos(a*Math.PI/180));
function uniDir(r,c){
  const pats=routeP[r]; const dirs=[0,1].filter(d=>pats.some(p=>p.d===d));
  if(dirs.length<2) return dirs[0]??0;
  const CTR=[42.3405,-3.7003]; /* Plaza Mayor area */
  const score=d=>{const p=mainPattern(pats.filter(q=>q.d===d),c);
    const near=pt=>{let bi=0,bd=1e12;p.s.forEach((s,i)=>{const x=distM(S[s].lat,S[s].lon,pt[0],pt[1]);if(x<bd){bd=x;bi=i}});return [bi,bd]};
    const [ui,ud]=near(UNI),[ci,cd]=near(CTR); const last=p.s[p.s.length-1];
    return {centreToUni:ud<1500&&cd<1500&&ui>ci, term:distM(S[last].lat,S[last].lon,UNI[0],UNI[1])}};
  const a=score(dirs[0]),b=score(dirs[1]);
  /* a line through the centre and the campus: take the direction that goes centre -> campus */
  if(a.centreToUni!==b.centreToUni) return a.centreToUni?dirs[0]:dirs[1];
  /* otherwise: the direction whose end is nearer the campus */
  return a.term<=b.term?dirs[0]:dirs[1];
}
function mainPattern(pats,c){let best=null,bn=-1;for(const p of pats){const n=tripsOn(p,c.key).length*1000+p.s.length;if(n>bn){bn=n;best=p}}return best}
function badge(r,cls=''){const x=R[r];return `<span class="badge ${cls}" style="background:${x.col};color:${x.txt}">${esc(x.n)}</span>`}

/* ---------- views ---------- */
const view=$('#view');
function render(keepScroll){
  const y=view.scrollTop;
  const top=st.stack[st.stack.length-1];
  document.querySelectorAll('.pbar [data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===st.tab&&!top)));
  panelTo(st.panel?(st.full?'large':'medium'):'closed'); $('#fab').hidden=st.panel;
  $('#grow').setAttribute('aria-label',T(st.full?'shrink':'expand'));
  $('#grow svg').style.transform=st.full?'rotate(180deg)':'';
  if(st.panel){
    if(top&&top.kind==='line') view.innerHTML=lineView(top);
    else if(top&&top.kind==='stop') view.innerHTML=stopView(top);
    else if(st.tab==='lines') view.innerHTML=linesView();
    else view.innerHTML=stopsView();
    if(keepScroll) view.scrollTop=y;
    /* iOS-style navigation: deeper slides in from the right, back returns from the left */
    const depth=st.stack.length;
    if(!keepScroll&&navPrev.open&&depth!==navPrev.depth){
      view.classList.remove('nav-push','nav-pop'); void view.offsetWidth; view.classList.add(depth>navPrev.depth?'nav-push':'nav-pop');
    }
  }
  navPrev={open:st.panel,depth:st.stack.length};
  syncMap();
  syncHistory();
}
/* One history entry per panel level, so the iPhone swipe-back / Android back button steps back
   through the panel (line -> list -> closed) instead of leaving the site. */
let navDepth=0, ignorePop=false;
function syncHistory(){
  const target=st.panel?1+st.stack.length:0;
  if(target>navDepth){ for(let i=navDepth;i<target;i++) history.pushState({bb:i+1},''); navDepth=target; }
  else if(target<navDepth){ ignorePop=true; history.go(target-navDepth); navDepth=target; }
}
window.addEventListener('popstate',()=>{
  if(ignorePop){ ignorePop=false; return; }
  navDepth=Math.max(0,navDepth-1);
  if($('#langsheet').classList.contains('open')){ openLang(false); }
  if(st.stack.length) st.stack.pop(); else if(st.panel){ st.panel=false; st.full=false; }
  render(true);
});
const wide=()=>matchMedia('(min-width:700px)').matches;
let navPrev={open:false,depth:0};

/* ---------- panel: floating card on tablets, spring-driven bottom sheet on phones ---------- */
const panelEl=$('#panel');
const hdrH=()=>$('.top').offsetHeight;
function updHdr(){ $('.app').style.setProperty('--hdr',hdrH()+'px'); }
const sheet={y:null,v:0,raf:0,state:'closed'};
let flickV=0;
function sheetH(){ return panelEl.offsetHeight||Math.max(200,$('.stage').clientHeight-hdrH()); }
function detentY(n){ const H=sheetH(); return n==='large'?0:n==='medium'?Math.round(H*0.42):H+16; }
function setSheetY(y){ sheet.y=y; panelEl.style.transform=`translate3d(0,${y.toFixed(2)}px,0)`; }
/* Apple's spring: damping ratio + response (seconds). Critically damped by default; a touch of bounce
   only when a flick handed it velocity. Interruptible: it always starts from the current position. */
function springSheet(target,v0,zeta,resp,done){
  cancelAnimationFrame(sheet.raf); sheet.v=v0||0;
  if(reduceMotion||sheet.y==null){ setSheetY(target); sheet.raf=0; done&&done(); return; }
  const k=Math.pow(2*Math.PI/resp,2), c=4*Math.PI*zeta/resp; let last=performance.now();
  const step=now=>{
    const dt=Math.min(.034,(now-last)/1000); last=now;
    for(let i=0;i<4;i++){ const h=dt/4, a=-k*(sheet.y-target)-c*sheet.v; sheet.v+=a*h; sheet.y+=sheet.v*h; }
    setSheetY(sheet.y);
    if(Math.abs(sheet.y-target)<.5&&Math.abs(sheet.v)<10){ setSheetY(target); sheet.raf=0; done&&done(); return; }
    sheet.raf=requestAnimationFrame(step);
  };
  sheet.raf=requestAnimationFrame(step);
}
let cardTimer=0;
function panelTo(name){
  const open=name!=='closed';
  if(wide()){
    panelEl.style.transform=''; sheet.state=name; clearTimeout(cardTimer);
    if(open){ if(panelEl.hidden){ panelEl.hidden=false; void panelEl.offsetWidth; } panelEl.classList.add('open'); }
    else if(!panelEl.hidden){ panelEl.classList.remove('open'); cardTimer=setTimeout(()=>{ if(!st.panel) panelEl.hidden=true; },280); }
    return;
  }
  panelEl.classList.add('open');
  if(sheet.state===name&&!flickV) return;          /* already there or on its way */
  sheet.state=name;
  if(open&&panelEl.hidden){ panelEl.hidden=false; setSheetY(detentY('closed')); }
  if(open) panelEl.style.setProperty('--sheet-gap',detentY(name)+'px');   /* lets the list scroll fully into view */
  const v=flickV; flickV=0;
  springSheet(detentY(name),v,v?.82:1,.34,()=>{ if(name==='closed'&&!st.panel) panelEl.hidden=true; });
}
const project=(v,d=.998)=>(v/1000)*d/(1-d);              /* where a flick would come to rest */
const rubber=(o,dim,c=.55)=>(o*dim*c)/(dim+c*Math.abs(o));  /* resistance past the top */
(function sheetDrag(){
  const bar=panelEl.querySelector('.pbar'); let drag=null;
  bar.addEventListener('pointerdown',e=>{
    if(wide()||drag||e.target.closest('button,input,a,select')) return;
    try{bar.setPointerCapture(e.pointerId)}catch(_){}
    cancelAnimationFrame(sheet.raf); sheet.raf=0;
    drag={id:e.pointerId,y0:e.clientY,s0:sheet.y??detentY('medium'),hist:[[e.timeStamp,e.clientY]]};
  });
  bar.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id) return;
    let y=drag.s0+(e.clientY-drag.y0); if(y<0) y=-rubber(-y,sheetH());
    setSheetY(y); drag.hist.push([e.timeStamp,e.clientY]); if(drag.hist.length>6) drag.hist.shift();
  });
  const end=e=>{
    if(!drag||e.pointerId!==drag.id) return;
    const h=drag.hist; drag=null; let v=0;
    if(h.length>1){ const [t0,a]=h[0],[t1,b]=h[h.length-1]; if(t1>t0) v=(b-a)/(t1-t0)*1000; }
    const proj=sheet.y+project(v);
    const best=['large','medium','closed'].map(n=>[n,detentY(n)]).reduce((a,b)=>Math.abs(b[1]-proj)<Math.abs(a[1]-proj)?b:a)[0];
    flickV=v||.0001; sheet.state=null;
    if(best==='closed'){ st.panel=false; st.full=false; } else st.full=(best==='large');
    render(true);
  };
  bar.addEventListener('pointerup',end); bar.addEventListener('pointercancel',end);
})();
function fallbackBanner(c){
  const r=resolveKey(c.key);
  if(!r.fb) return '';
  return `<div class="banner">${T('banner',{from:longKey(dataKeys[0]),to:longKey(dataKeys[dataKeys.length-1]),day:prettyKey(c.key),wday:wdayLong(r.key),date:longKey(r.key)})}</div>`;
}

function lineRow(r,c){
  const pats=routeP[r]; const act=activeTrips(pats,c).length;
  let first=null; for(const p of pats){for(const {t,off} of dayTrips(p,c)){const tm=t.start+off;if(tm>=c.from&&(!first||tm<first.tm))first={tm,p}}}
  let sub;
  if(act) sub=`<span class="live"><span class="livedot"></span>${T('running',{n:act})}</span>`;
  else if(first) sub=T('next',{time:hhmm(first.tm),dest:esc(first.p.h)});
  else sub=T(c.live?'noMoreToday':'noServiceDay');
  const on=fav.lines.includes(r);
  const lit=active.has(r);
  return `<div class="row"><button class="tog" data-toggle="${r}" aria-pressed="${lit}" aria-label="${T(lit?'hideLine':'showLine',{n:esc(R[r].n)})}">${badge(r,lit?'':'off')}</button><button class="row" style="padding:0;border:0;flex:1;min-width:0" data-line="${r}"><div class="main"><div class="t1">${esc(R[r].name)}</div><div class="t2">${sub}</div></div></button><button class="star ${on?'on':''}" data-fav-line="${r}" aria-label="${T(on?'favRemove':'favAdd')}">★</button></div>`;
}
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function linesView(){
  const c=ctx();
  return `<div class="pad">${fallbackBanner(c)}<input id="q-lines" class="search" type="search" placeholder="${T('searchLines')}" value="${esc(st.q)}" autocomplete="off"><div class="bulk"><button class="chip" data-showall>${T('showAll')}</button><button class="chip" data-hideall>${T('hideAll')}</button></div><p class="note" style="margin-top:8px">${T('linesHint')}</p><div id="res">${linesResults(c)}</div></div>`;
}
function linesResults(c){
  const q=norm(st.q.trim()), qn=q.replace(/^0+(?=\d)/,'');
  const match=r=>!q||norm(R[r].name).includes(q)||norm(R[r].n).includes(q)||R[r].n.replace(/^0+(?=\d)/,'').toLowerCase()===qn;
  const all=R.map(r=>r.i).filter(match);
  const favs=fav.lines.filter(r=>R[r]&&match(r));
  const night=all.filter(r=>/^Buho/i.test(R[r].name));
  const day=all.filter(r=>!night.includes(r));
  let h='';
  if(favs.length) h+=`<div class="eyebrow">${T('favourites')}</div><div class="list">${favs.map(r=>lineRow(r,c)).join('')}</div>`;
  h+=`<div class="eyebrow" data-sec="all">${T('allLines')}</div><div class="list">${day.map(r=>lineRow(r,c)).join('')||`<div class="empty">${T('noLines')}</div>`}</div>`;
  if(night.length) h+=`<div class="eyebrow">${T('night')}</div><div class="list">${night.map(r=>lineRow(r,c)).join('')}</div>`;
  h+=`<p class="note">${T('footer',{from:longKey(dataKeys[0]),to:longKey(dataKeys[dataKeys.length-1])})}</p><p class="note" style="margin-top:6px">${T('version',{v:esc(BUILD)})}</p>`;
  return h;
}

function lineView(v){
  const c=ctx(); const r=v.r; const x=R[r];
  const pats=routeP[r];
  const ud=uniDir(r,c);
  const dirs=[0,1].filter(d=>pats.some(p=>p.d===d)).sort((a,b)=>(b===ud)-(a===ud));
  if(!dirs.includes(v.d)) v.d=dirs[0];
  const dirPats=pats.filter(p=>p.d===v.d);
  const running=dirPats.filter(p=>tripsOn(p,c.key).length);
  const variants=(running.length?running:dirPats).slice().sort((a,b)=>tripsOn(b,c.key).length-tripsOn(a,c.key).length||b.s.length-a.s.length);
  let p=variants.find(q=>q.id===v.p)||variants[0]; v.p=p.id;
  const on=fav.lines.includes(r);
  let h=`<div class="dhead" style="--rc:${x.col}"><button class="back" data-back aria-label="${T('back')}">${BACK}</button>${badge(r,'lg')}<div class="main"><h2>${esc(x.name)}</h2><div class="sub">${c.live?T('today'):prettyKey(c.key)}</div></div><button class="star ${on?'on':''}" data-fav-line="${r}" aria-label="${T(on?'favRemove':'favAdd')}">★</button></div><div class="pad">${fallbackBanner(c)}`;
  if(dirs.length>1){
    h+=`<div class="seg" role="group" aria-label="${T('direction')}">${dirs.map(d=>{const mp=mainPattern(pats.filter(q=>q.d===d),c);return `<button data-dir="${d}" aria-pressed="${d===v.d}">${T('to',{dest:esc(mp.h)})}<span>${T('from',{stop:esc(S[mp.s[0]].name)})}</span></button>`}).join('')}</div>`;
  }
  if(variants.length>1){

    if(shown.length) times=shown.map((d,n)=>{
      const diff=d.tm-c.nowSec, other=d.p.h!==p.h?`<em>→ ${esc(d.p.h)}</em>`:'';

    }

  });
  h+=`</div><p class="note">${T('tapStop')}</p></div>`;
  return h;
}

function initMap(){

  map.on('popupclose',e=>{if(e.popup._stop!=null&&e.popup._stop===popupStop){popupStop=null;markSel()}});

function syncMap(){
  if(!map) return;
  const sel=selection();
  const shown=shownLines();
  const key=sel.r+'|'+sel.pid+'|'+st.day+'|'+[...shown].sort((a,b)=>a-b).join(',');
  const chip=$('#selchip');
  if(sel.r>=0&&!st.panel){const x=R[sel.r];chip.hidden=false;chip.innerHTML=`<button data-openpanel="current" style="display:flex;align-items:center;gap:8px;min-width:0">${badge(sel.r)}<span class="nm">${esc(x.name)}</span></button><button class="x" data-clearsel aria-label="${T('showAllLines')}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`}
  else chip.hidden=true;

    const prevR=drawnKey==null?null:+drawnKey.split('|')[0];

    if(sel.r>=0){
      const p=P.find(q=>q.id===sel.pid);
      const pts=p?SH[p.sh].pts:routeP[sel.r].flatMap(q=>SH[q.sh].pts);

/* the stop whose pop-up is open wins; otherwise the stop open or highlighted in the panel */
let popupStop=null;
let markedStop=null;
function markSel(){

  const i=popupStop??selection().stop;
  if(i===markedStop&&ringLayer.getLayers().length===(i==null?0:1)) return;
  ringLayer.clearLayers(); markedStop=i; if(i==null) return;
  const s=S[i];
  L.marker([s.lat,s.lon],{icon:L.divIcon({className:'selstop',html:'<span class="ring"></span><span class="dot"></span>',iconSize:[34,34],iconAnchor:[17,17]}),interactive:false,keyboard:false,zIndexOffset:400}).addTo(ringLayer);
}
function stopPop(i){const pp=L.popup({maxWidth:270}).setContent(stopPopup(i));pp._stop=i;return pp}
function focusStop(i){
  if(!map) return; const s=S[i];
  map.fitBounds(L.latLng(s.lat,s.lon).toBounds(500),Object.assign({maxZoom:17},fitPad()));
}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const canHover=matchMedia('(hover: hover) and (pointer: fine)').matches;
function growStop(m,target){
  if(m._anim) cancelAnimationFrame(m._anim);
  const from=m.getRadius(), t0=performance.now(), dur=160;
  if(reduceMotion){m.setRadius(target);return}
  const step=now=>{const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);m.setRadius(from+(target-from)*e);if(k<1)m._anim=requestAnimationFrame(step);else m._anim=null};

function drawRoutes(sel){
  if(baseLayer) baseLayer.remove(); if(stopLayer) stopLayer.remove();
  baseLayer=L.layerGroup(); stopLayer=L.layerGroup();
  const r0=sel.r;
  const shown=shownLines();
  const order=R.map(r=>r.i).filter(i=>i!==r0&&shown.has(i)); if(r0>=0) order.push(r0);
  const selP=P.find(q=>q.id===sel.pid);
  /* the rest of the network, thin and grey, so the map always shows what the buses cover */
  const greySeen=new Set(), greyOp=r0>=0?.16:(isDarkNow()?.42:.5);
  for(const x of R){ if(shown.has(x.i)) continue;
    for(const p of routeP[x.i]){ if(greySeen.has(p.sh)) continue; greySeen.add(p.sh);
      L.polyline(SH[p.sh].pts,{color:'#8E8E93',weight:2.5,opacity:greyOp,interactive:false}).addTo(baseLayer); } }
  for(const r of order){
    const seen=new Set();
    const pats=routeP[r].slice().sort((a,b)=>(selP&&a.id===selP.id)-(selP&&b.id===selP.id));
    for(const p of pats){ if(seen.has(p.sh)) continue; seen.add(p.sh);
      const hi=r0===r, dim=r0>=0&&!hi;  /* other shown lines fade while one is open */
      const main=hi&&(!selP||p.id===selP.id||p.sh===selP.sh);

    }

    const m=L.circleMarker([S[i].lat,S[i].lon],{radius:base,color:on?R[r0].col:(faded?mut:ink),weight:on?3:1.5,opacity:faded?.55:1,fillColor:surf,fillOpacity:faded?.7:1});
    m.on('click',()=>{m.bindPopup(stopPop(i)).openPopup()});
    if(canHover){ m.on('mouseover',()=>growStop(m,base*1.8)); m.on('mouseout',()=>growStop(m,base)); }
    m.addTo(stopLayer);

}
function stopPopup(i){
  const c=ctx(); const deps=departuresAt(i,c,null,{from:c.from-30});
  const groups=new Map();
  for(const d of deps){const k=d.p.r+'|'+d.p.h;if(!groups.has(k))groups.set(k,{r:d.p.r,h:d.p.h,pid:d.p.id,t:[]});const g=groups.get(k);if(g.t.length<3)g.t.push(d.tm)}

  const rows=[...groups.values()].sort((a,b)=>a.t[0]-b.t[0]).map(g=>`<li><button class="pl" data-line="${g.r}" data-dirp="${g.pid}" data-hl="${i}">${badge(g.r,'sm')}<span class="ph">${esc(g.h)}</span></button><span class="pt">${g.t.map((tm,n)=>{const df=tm-c.nowSec;return n===0&&c.live&&df<60?T('due'):n===0&&c.live&&df<=1200?T('min',{n:Math.floor(df/60)}):hhmm(tm)}).join(' · ')}</span></li>`).join('');
  return `<div class="pop"><h4>${esc(S[i].name)}</h4><div class="code">${T('stopCode',{code:esc(S[i].code)})} · ${c.live?T('nextBuses'):prettyKey(c.key)}</div><ul>${rows||`<li>${T(c.live?'noMoreToday':'noBusesDay')}</li>`}</ul>${served.length?`<div class="code" style="margin-bottom:6px">${T('alsoStops')} ${served.map(r=>badge(r,'sm')).join(' ')}</div>`:''}<button data-stop="${i}">${T('fullTT')}</button></div>`;
}
/* Your location: the first tap finds you and opens the nearest stop; from then on the dot
   follows you live (watchPosition), gliding between fixes. Tapping again centres the map on you
   and keeps it there until you drag the map. Tracking pauses while the page is in the background. */
let meMarker=null, meAcc=null, meLL=null, meAnim=0, watchId=null, follow=false;
function setFollow(v){ follow=v; const b=document.querySelector('.locate'); if(b) b.classList.toggle('following',v); }
function placeMe(ll,acc){

    meMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<span class="me"></span>',iconSize:[18,18],iconAnchor:[9,9]}),keyboard:false,interactive:false,zIndexOffset:900,title:T('here')}).addTo(map);
    meLL=ll; return;

    const q=[from.lat+(ll[0]-from.lat)*e, from.lng+(ll[1]-from.lng)*e];

function startWatch(){

    err=>{ if(err.code===1){ stopWatch(); setFollow(false); } },   /* permission withdrawn; other errors are transient */
    {enableHighAccuracy:true,maximumAge:3000,timeout:20000});
}
function stopWatch(){ if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; } }

function locateMe(){

    const ll=[pos.coords.latitude,pos.coords.longitude];
    placeMe(ll,pos.coords.accuracy); startWatch();
    let best=-1,bd=1e9; S.forEach((s,i)=>{if(!stopRefs[i].length)return;const d=(s.lat-ll[0])**2+((s.lon-ll[1])*Math.cos(ll[0]*Math.PI/180))**2;if(d<bd){bd=d;best=i}});
    const km=Math.sqrt(bd)*111;
    if(best>=0&&km<3){ map.setView([S[best].lat,S[best].lon],17); stopPop(best).setLatLng([S[best].lat,S[best].lon]).openOn(map); }
    else { setFollow(true); map.setView(ll,16); }
  },()=>{ done(); L.popup().setLatLng(map.getCenter()).setContent(`<div class="pop">${T('locOff')}</div>`).openOn(map); },{enableHighAccuracy:true,timeout:10000,maximumAge:5000});
}
function pointAlong(sh,dist){
  const {pts,cum}=SH[sh]; if(dist<=cum[0]) return pts[0]; if(dist>=cum[cum.length-1]) return pts[pts.length-1];
  let lo=0,hi=cum.length-1; while(hi-lo>1){const m=(lo+hi)>>1; if(cum[m]<=dist) lo=m; else hi=m}
  const f=(dist-cum[lo])/((cum[hi]-cum[lo])||1);
  return [pts[lo][0]+(pts[hi][0]-pts[lo][0])*f, pts[lo][1]+(pts[hi][1]-pts[lo][1])*f];
}
const BUS_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 4.5C5 3.1 6.1 2 7.5 2h9C17.9 2 19 3.1 19 4.5V18c0 .6-.4 1-1 1h-.5v1.5a1 1 0 0 1-2 0V19h-7v1.5a1 1 0 0 1-2 0V19H6a1 1 0 0 1-1-1z"/><path fill="var(--c)" d="M7 5.5c0-.3.2-.5.5-.5h9c.3 0 .5.2.5.5V11c0 .3-.2.5-.5.5h-9A.5.5 0 0 1 7 11z"/><circle cx="8.5" cy="15" r="1.3" fill="var(--c)"/><circle cx="15.5" cy="15" r="1.3" fill="var(--c)"/></svg>';
/* compass heading (degrees clockwise from north) of the route at distance d along a shape */
function headingAt(sh,d){
  const span=SH[sh].cum[SH[sh].cum.length-1];
  let a=pointAlong(sh,Math.max(0,d-12)), b=pointAlong(sh,Math.min(span,d+12));
  if(a[0]===b[0]&&a[1]===b[1]) return null;
  const dy=b[0]-a[0], dx=(b[1]-a[1])*Math.cos(a[0]*Math.PI/180);
  return (Math.atan2(dx,dy)*180/Math.PI+360)%360;
}
/* A city bus seen from above, nose up: windscreen and mirrors at the front, roof air-con unit,
   roof hatch, rear window. Body takes the line colour; the middle of the roof stays clear for the number. */
const BUS_TOP='<svg class="body" viewBox="0 0 26 56" aria-hidden="true"><rect x=".6" y="10.5" width="3.2" height="4.2" rx="1.4" fill="#1d1d1f"/><rect x="22.2" y="10.5" width="3.2" height="4.2" rx="1.4" fill="#1d1d1f"/><path d="M8.5 2h9a6.5 6.5 0 0 1 6.5 6.5V51a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V8.5A6.5 6.5 0 0 1 8.5 2z" style="fill:var(--c)" stroke="#fff" stroke-width="1.6"/><path d="M8.6 3.6h8.8a5 5 0 0 1 5 4.6l.1 1.4q-9.5-2.4-19 0l.1-1.4a5 5 0 0 1 5-4.6z" fill="#0e1520" fill-opacity=".72"/><path d="M6.5 5.6q6.5-1.6 13 0" stroke="#fff" stroke-opacity=".45" stroke-width=".7" fill="none" stroke-linecap="round"/><rect x="3.3" y="12" width="1.3" height="37" rx=".6" fill="#000" fill-opacity=".22"/><rect x="21.4" y="12" width="1.3" height="37" rx=".6" fill="#000" fill-opacity=".22"/><rect x="6.6" y="11.5" width="12.8" height="7.2" rx="1.6" fill="#fff" fill-opacity=".3"/><path d="M8.6 13.6h8.8M8.6 15.1h8.8M8.6 16.6h8.8" stroke="#000" stroke-opacity=".18" stroke-width=".6"/><rect x="9" y="39.5" width="8" height="4.4" rx="1" fill="#000" fill-opacity=".16"/><rect x="5.2" y="50.2" width="15.6" height="2.2" rx="1" fill="#0e1520" fill-opacity=".45"/></svg>';
const busMarkers=new Map(); /* one marker per trip, moved in place every second */
/* Detail card for a tapped bus: whether it is moving, stopped at a stop or waiting to start,
   where it is heading, how far along the route it is and its next stops. Refreshed every second. */
function busPopup(id){
  const m=busMarkers.get(id); if(!m) return '';
  const a=m._a, x=R[a.p.r], p=a.p, c=ctx(), N=c.nowSec, t0=a.t.start+a.off;
  const at=k=>t0+a.t.prof[k];
  const cd=k=>{const r=rel(at(k)-N);return r?`${r} · ${hhmm(at(k))}`:hhmm(at(k))};
  let state, line1, from;
  if(a.wait){ state='wait'; line1=T('nextLeaves',{stop:esc(S[p.s[0]].name),time:hhmm(t0)}); from=1; }
  else if(N-at(a.k)<=20){ state='stop'; line1=T('atStop',{stop:esc(S[p.s[a.k]].name)}); from=a.k+1; }
  else { state='move'; line1=`${T('headingTo',{stop:esc(S[p.s[a.k+1]].name)})} · ${cd(a.k+1)}`; from=a.k+1; }
  const label={move:'busMoving',stop:'busStopped',wait:'busWaiting'}[state];
  const nextIdx=a.wait?0:(state==='stop'?a.k:a.k+1);
  const ups=[]; for(let k=Math.max(from,state==='move'?a.k+2:from);k<p.s.length&&ups.length<3;k++) ups.push(k);
  const last=p.s.length-1;
  return `<div class="pop busdet"><div class="dyn">
<h4><span class="badge sm" style="background:${x.col};color:${x.txt}">${esc(x.n)}</span> → ${esc(p.h)}</h4>
<div class="bstat ${state}"><span class="sdot"></span><b>${T(label)}</b></div>
<div class="bline">${line1}</div>
<div class="code">${T('progress',{k:nextIdx+1,n:p.s.length})}</div>
<div class="bar"><span style="width:${(100*(nextIdx)/Math.max(1,last)).toFixed(1)}%"></span></div>
${ups.length?`<div class="code" style="margin-top:8px">${T('upcoming')}</div><ul>${ups.map(k=>`<li><span class="ph">${esc(S[p.s[k]].name)}</span><b>${hhmm(at(k))}</b></li>`).join('')}</ul>`:''}
<div class="code">${T('endsAt',{stop:esc(S[p.s[last]].name),time:hhmm(at(last))})}</div>
<div class="code" style="margin:6px 0">${T('busEst')}</div></div>
<button data-line="${p.r}" data-dirp="${p.id}" data-keepdir>${T('openLine')}</button></div>`;
}
function drawBuses(){
  if(!map) return;
  const c=ctx(); const seen=new Set();
  if(c.live){
    const sel=selection(); const shown=shownLines(); const pats=P.filter(p=>shown.has(p.r)||p.r===sel.r);
    for(const a of activeTrips(pats,c).concat(waitingTrips(pats,c))){
      const id=a.p.id+':'+a.t.start+':'+a.off; seen.add(id);
      const d=a.p.dist[a.k]+(a.p.dist[a.k+1]-a.p.dist[a.k])*a.f;
      const ll=pointAlong(a.p.sh,d), hd=headingAt(a.p.sh,d), x=R[a.p.r];
      let m=busMarkers.get(id);
      if(!m){
        const icon=L.divIcon({className:'vehwrap',html:`<div class="veh" style="--c:${x.col};--t:${x.txt}"><span class="hit"></span><div class="rot"><span class="arrow"></span>${BUS_TOP}</div><span class="num">${esc(x.n)}</span></div>`,iconSize:[60,60],iconAnchor:[30,30]});
        m=L.marker(ll,{icon,keyboard:false,title:T('busTitle',{n:x.n,dest:a.p.h}),zIndexOffset:500}).addTo(busLayer);
        m.bindPopup(()=>{m._ph=busPopup(id);return m._ph},{maxWidth:280,minWidth:220,autoPanPaddingTopLeft:L.point(16,90)});
        busMarkers.set(id,m);
      } else m.setLatLng(ll);
      m._a=a;
      if(m.isPopupOpen()){ /* refresh only the text part so the button under a finger is never swapped out */
        const h=busPopup(id); if(h!==m._ph){ m._ph=h; const box=m.getPopup().getElement(), dyn=box&&box.querySelector('.dyn');
          if(dyn){ const tmp=document.createElement('div'); tmp.innerHTML=h; dyn.innerHTML=tmp.querySelector('.dyn').innerHTML; } else m.getPopup().setContent(h); } }
      const el=m.getElement(), dir=el&&el.querySelector('.rot');
      if(el) el.classList.toggle('parked',!!a.wait);
      if(dir){
        if(hd==null) dir.querySelector('.arrow').style.visibility='hidden';
        else {
          /* turn the short way round so the arrow never spins a full circle */
          const prev=m._hd??hd; let delta=((hd-prev)%360+540)%360-180; const next=prev+delta;
          m._hd=next; dir.querySelector('.arrow').style.visibility=''; dir.style.transform=`rotate(${next}deg)`;
        }
      }
    }
  }
  for(const [id,m] of busMarkers){ if(!seen.has(id)){ busLayer.removeLayer(m); busMarkers.delete(id); } }
}

/* ---------- day picker & clock ---------- */
function buildDays(){
  const now=madridNow(); const sel=$('#day');
  sel.innerHTML=Array.from({length:8},(_,i)=>`<option value="${i}">${i===0?T('today'):i===1?T('tomorrow'):prettyKey(addDays(now.key,i))}</option>`).join('');
  sel.value=String(st.day);
}
function tickClock(){const n=madridNow();$('#clock').textContent=T('sub',{time:hhmm(n.sec)})}

/* ---------- first-visit hint ---------- */
let hintTimer=0;
function showHint(){ if(!firstVisit) return; const h=$('#hint'); h.hidden=false;
  hintTimer=setTimeout(()=>{ void h.offsetWidth; h.classList.add('show'); },700); }
function dismissHint(){ if(!firstVisit) return; firstVisit=false; clearTimeout(hintTimer);
  try{localStorage.setItem('burgosbus-hinted','1')}catch(e){}
  const h=$('#hint'); h.classList.remove('show'); setTimeout(()=>{h.hidden=true},reduceMotion?160:260); }

/* ---------- appearance ---------- */
const THEME_NEXT={auto:'light',light:'dark',dark:'auto'};
const themeName=m=>T(m==='auto'?'themeAuto':m==='light'?'themeLight':'themeDark');
const sysDark=()=>matchMedia('(prefers-color-scheme: dark)').matches;
const darkFor=m=>m==='dark'||(m==='auto'&&sysDark());
const isDarkNow=()=>darkFor(themeMode);
function paintThemeBtn(){const b=$('#themebtn'); b.dataset.mode=themeMode; b.setAttribute('aria-label',`${T('theme')}: ${themeName(themeMode)}`); b.title=T('theme');}
function setTheme(m){
  const before=darkFor(themeMode), after=darkFor(m), root=document.documentElement;
  const apply=()=>{ themeMode=m; if(m==='auto') delete root.dataset.theme; else root.dataset.theme=m;
    try{ if(m==='auto') localStorage.removeItem('burgosbus-theme'); else localStorage.setItem('burgosbus-theme',m);}catch(e){}
    paintThemeBtn(); return before!==after?themeChanged():Promise.resolve(); };
  const tip=$('#themetip'); tip.textContent=themeName(m); tip.classList.remove('show'); void tip.offsetWidth; tip.classList.add('show');
  clearTimeout(tipTimer); tipTimer=setTimeout(()=>tip.classList.remove('show'),1400);
  if(before===after||reduceMotion||!document.startViewTransition){ apply(); return; }
  const r=$('#themebtn').getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2;
  const end=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  try{
    const vt=document.startViewTransition(apply);
    vt.ready.then(()=>root.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${end}px at ${x}px ${y}px)`]},
      {duration:620,easing:'cubic-bezier(.32,.72,0,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
  }catch(e){ apply(); }
}

/* ---------- language ---------- */
function applyStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=T(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',T(e.dataset.i18nAria)));
  const lb=$('#langbtn'); lb.innerHTML=`${flagHtml(lang)}<span>${lang.toUpperCase()}</span>`; lb.setAttribute('aria-label',`${T('language')}: ${I18N[lang].name}`);
  $('#langtitle').textContent=T('language'); $('#q-lang').placeholder=T('searchLang'); $('#langclose').setAttribute('aria-label',T('close'));
  document.querySelectorAll('.locate').forEach(a=>{a.title=T('locate');a.setAttribute('aria-label',T('locate'))});
  paintThemeBtn();
}
function langList(){
  const q=$('#q-lang').value.trim().toLowerCase();
  const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const nq=norm(q);
  const hit=c=>!nq||norm(I18N[c].name).includes(nq)||norm(I18N[c].en).includes(nq)||c.includes(nq);
  const row=c=>`<button class="lrow" data-lang="${c}" aria-current="${c===lang}">${flagHtml(c)}<div class="main"><div class="t1">${esc(I18N[c].name)}</div>${I18N[c].en!==I18N[c].name?`<div class="t2">${esc(I18N[c].en)}</div>`:''}</div>${c===lang?'<span class="ck" aria-hidden="true">✓</span>':''}</button>`;
  const rest=Object.keys(I18N).filter(c=>!MAIN_LANGS.includes(c)).sort((a,b)=>I18N[a].name.localeCompare(I18N[b].name,'es'));
  const main=MAIN_LANGS.filter(hit), more=rest.filter(hit);
  let h='';
  if(main.length) h+=`<div class="eyebrow">${T('mainLangs')}</div><div class="list">${main.map(row).join('')}</div>`;
  if(more.length) h+=`<div class="eyebrow">${T('moreLangs')}</div><div class="list">${more.map(row).join('')}</div>`;
  $('#langlist').innerHTML=h||`<div class="empty">${T('noLangs')}</div>`;
}
let langTimer=0;
function openLang(open){
  const sh=$('#langsheet'), bk=$('#langback'); clearTimeout(langTimer);
  if(open){ sh.hidden=false; bk.hidden=false; void sh.offsetWidth; sh.classList.add('open'); bk.classList.add('open');
    $('#q-lang').value=''; langList(); if(wide()) $('#q-lang').focus(); }
  else { sh.classList.remove('open'); bk.classList.remove('open'); langTimer=setTimeout(()=>{ sh.hidden=true; bk.hidden=true; },reduceMotion?170:330); $('#langbtn').focus(); }
}
function setLang(c){
  if(!I18N[c]) return; lang=c;
  try{localStorage.setItem('burgosbus-lang',c)}catch(e){}
  applyStatic(); buildDays(); tickClock();
  for(const m of busMarkers.values()) busLayer.removeLayer(m); busMarkers.clear();
  drawnKey=null; if(map) map.closePopup();
  render(true); langList();
}

/* ---------- events ---------- */
function openLine(r,opts={}){
  const v={kind:'line',r,d:0,p:null,open:null,hl:opts.hl??null};
  /* lines always open heading to the university first; only a specific bus keeps its own direction */
  if(opts.pat!=null&&opts.keep){const p=P[opts.pat];v.d=p.d;v.p=p.id}
  else v.d=uniDir(r,ctx());
  if(!active.has(r)){active.add(r);saveActive()}
  st.panel=true; st.stack.push(v); render(); view.scrollTop=0;
  if(v.hl!=null) requestAnimationFrame(()=>{const p=P.find(q=>q.id===v.p)||null;const el=view.querySelector('.stop.hl');if(el)el.scrollIntoView({block:'center'})});
}
function openStop(s){st.panel=true;st.stack.push({kind:'stop',s});render();view.scrollTop=0;focusStop(s)}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,a'); if(!t) return;
  if(t.dataset.tab){st.tab=t.dataset.tab;st.stack=[];render();view.scrollTop=0;return}
  if(t.hasAttribute('data-back')){st.stack.pop();render();return}
  if(t.dataset.favLine!=null){toggleFav('lines',+t.dataset.favLine,t);return}
  if(t.dataset.favStop!=null){toggleFav('stops',+t.dataset.favStop,t);return}
  if(t.dataset.openpanel!=null){const w=t.dataset.openpanel;st.panel=true;if(w!=='current'){st.tab=w;st.stack=[]}render();view.scrollTop=0;return}
  if(t.id==='close-panel'){st.panel=false;st.full=false;render();return}
  if(t.id==='grow'){st.full=!st.full;render(true);return}
  if(t.hasAttribute('data-clearsel')){st.stack=[];render();return}
  if(t.id==='hintx'||t.id==='open-lines'||t.dataset.toggle!=null||t.dataset.line!=null||t.hasAttribute('data-showall')) dismissHint();
  if(t.id==='hintx') return;
  if(t.id==='themebtn'){setTheme(THEME_NEXT[themeMode]);return}
  if(t.id==='langbtn'){openLang(true);return}
  if(t.id==='langclose'){openLang(false);return}
  if(t.dataset.lang){setLang(t.dataset.lang);openLang(false);return}
  if(t.dataset.toggle!=null){toggleActive(+t.dataset.toggle);return}
  if(t.hasAttribute('data-showall')){active=new Set(R.map(r=>r.i));saveActive();render(true);return}
  if(t.hasAttribute('data-hideall')){active.clear();saveActive();render(true);return}
  if(t.dataset.line!=null){if(map)map.closePopup();openLine(+t.dataset.line,{pat:t.dataset.dirp!=null?+t.dataset.dirp:null,keep:t.hasAttribute('data-keepdir'),hl:t.dataset.hl!=null?+t.dataset.hl:null});return}
  if(t.dataset.stop!=null){if(map)map.closePopup();openStop(+t.dataset.stop);return}
  const top=st.stack[st.stack.length-1];
  if(top&&top.kind==='line'){
    if(t.dataset.dir!=null){top.d=+t.dataset.dir;top.p=null;top.open=null;render();view.scrollTop=0;return}
    if(t.dataset.pat!=null){top.p=+t.dataset.pat;top.open=null;render(true);return}
    if(t.dataset.open!=null){const i=+t.dataset.open;top.open=top.open===i?null:i;const p=P.find(q=>q.id===top.p);if(top.open!=null&&p){top.hl=p.s[i];render(true);if(!st.full)focusStop(p.s[i])}else render(true);return}
  }
});
function onSearch(e){
  if(e.isComposing) return;   /* wait for the keyboard to finish composing (Chinese, Japanese, accents) */
  const res=$('#res'); if(!res) return;
  if(e.target.id==='q-lines'){st.q=e.target.value;res.innerHTML=linesResults(ctx())}
  if(e.target.id==='q-stops'){st.sq=e.target.value;res.innerHTML=stopsResults()}
}
view.addEventListener('input',onSearch);
view.addEventListener('compositionend',onSearch);
$('#day').addEventListener('change',e=>{st.day=+e.target.value;render(true);drawBuses()});

applyStatic(); buildDays(); tickClock(); updHdr(); initMap(); applyStatic(); render(); showHint();
if(window.ResizeObserver) new ResizeObserver(updHdr).observe($('.top'));
$('#langback').addEventListener('click',()=>openLang(false));
/* Browsers keep a cached copy of the page for up to 10 minutes. Ask the server for the
   current page (bypassing the cache) and, if it was built after this copy, reload onto it. */
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const m=(await r.text()).match(/const BUILD_ID = '(\d+)'/);
    if(!m||+m[1]<=+BUILD_ID) return;
    let tried=null; try{tried=sessionStorage.getItem('burgosbus-upd')}catch(e){}
    if(tried===m[1]) return;   /* already reloaded for this build once; don't loop */
    try{sessionStorage.setItem('burgosbus-upd',m[1])}catch(e){}
    location.replace(location.pathname+'?v='+m[1]+location.hash);
  }catch(e){}
}
setTimeout(checkUpdate,1500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
setInterval(checkUpdate,5*60*1000);
$('#q-lang').addEventListener('input',langList);
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if($('#langsheet').classList.contains('open')){ openLang(false); return; }
  if(map&&map._popup&&map.hasLayer(map._popup)){ map.closePopup(); return; }
  if(st.panel){ if(st.stack.length) st.stack.pop(); else { st.panel=false; st.full=false; } render(); }
});
window.addEventListener('resize',()=>{ updHdr(); if(map) map.invalidateSize();
  if(wide()){ panelEl.style.transform=''; panelEl.classList.toggle('open',st.panel); }
  else if(st.panel){ sheet.state=null; flickV=0; cancelAnimationFrame(sheet.raf); setSheetY(detentY(st.full?'large':'medium')); sheet.state=st.full?'large':'medium'; panelEl.style.setProperty('--sheet-gap',detentY(sheet.state)+'px'); }
});
setInterval(()=>{
  tickClock();
  const a=document.activeElement; if(a&&a.tagName==='INPUT') return;
  if(st.panel) render(true);
  refreshStopPopup();
},20000);
function refreshStopPopup(){
  if(!map) return; const pp=map._popup; if(!pp||pp._stop==null||!map.hasLayer(pp)) return;
  const h=stopPopup(pp._stop); if(h!==pp._h){ pp._h=h; pp.setContent(h); }
}
/* move the buses every second; skip while the tab is hidden */
setInterval(()=>{ if(!document.hidden) drawBuses(); },1000);
let lastKey=madridNow().key;
setInterval(()=>{const k=madridNow().key;if(k!==lastKey){lastKey=k;buildDays();render(true)}},60000);
/* test hook for the timetable audit; inert unless the page is opened with #audit */
if(location.hash==='#audit') window.__bb={P,S,R,ctx,activeTrips,upcomingPlan,dayTrips,departuresAt,tripKey,distM,pointAlong};
})();
